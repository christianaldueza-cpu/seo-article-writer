<!DOCTYPE html>
<html>
<head>
  <title>SEO Article Writer</title>
</head>

<body>

  <h1>SEO Article Writer</h1>

  <p>Enter the information for your article.</p>

  <label>Primary Keyword</label>
  <br>
  <input type="text" placeholder="Example: best linen shirts">
  
  <br><br>

  <label>Article Length</label>
  <br>
  <select>
    <option>500 words</option>
    <option>1000 words</option>
    <option>1500 words</option>
    <option>2000 words</option>
  </select>

  <br><br>

  <label>Tone</label>
  <br>
  <select>
    <option>Natural</option>
    <option>Professional</option>
    <option>Friendly</option>
    <option>Persuasive</option>
  </select>

  <br><br>

  <label>Extra Instructions</label>
  <br>
  <textarea rows="6" cols="50"
    placeholder="Example: Include FAQs, buying advice, H2 and H3 headings..."></textarea>

  <br><br>

  <button>Generate Article</button>

</body>
</html>
